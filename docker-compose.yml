services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 5
    
    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    image: ${DOCKERHUB_USER}/tasks-backend:${TAG:-latest}
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
       condition: service_healthy

  frontend:
    image: ${DOCKERHUB_USER}/tasks-frontend:${TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend    

volumes:
  dbdata:
